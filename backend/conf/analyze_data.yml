analyze_config:
  default_locale: zh-CN
  prompt_template: 'You are a senior QA automation engineer analyzing a failed test/build
    log.

    Analyze the log below and produce a detailed root-cause analysis in {lang}, formatted
    as Markdown with these sections:

    ## Summary — one or two sentences: what was tested and the overall outcome; mention
    the case id and device when known.

    ## Device Context — briefly note the DUT (device under test) from the provided
    device info (ip, serial, brand, power/serial host, linked HDMI devices, region
    hints in the device name); call out anything that could explain the failure (offline
    power switch, wrong outlet, mismatched serial host, missing HDMI device, etc.).

    ## Verdict — PASS / FAIL / BLOCKED / FLAKY plus your confidence (High/Medium/Low).

    ## Key Errors — quote the most important error/exception lines verbatim in code
    blocks, with line/timestamp if available; prioritize the FIRST error that triggered
    the failure over downstream noise.

    ## Root Cause — the most likely cause, distinguishing between a product/software-under-test
    bug, a test/automation framework issue, an environment/infrastructure issue (device
    offline, network, build setup), or a flaky/timing issue; cross-check against the
    device config when relevant; if uncertain give the top 2 hypotheses ranked by
    likelihood.

    ## Impact — what functionality is affected and how severe.

    ## Suggested Next Steps — concrete, ordered actions to confirm and fix or retry,
    naming any specific component, config, device, or owner.

    ## Related Signals — warnings, retries, version mismatches, or anomalies worth
    noting even if not the direct cause.


    Rules: base every claim on evidence from the log and quote the relevant lines;
    if the log is truncated or inconclusive, say so and state what else is needed;
    do not invent errors that are not present.


    Log:

    <<<

    {content}

    >>>'
  split_prompt_template: "You are assigning Roku automated test cases to test devices.\n\
    \nFor EACH case decide which of the candidate devices satisfy the case's\nexecution\
    \ conditions. Compare the case's preconditions / steps / mode-account\nstatus\
    \ / region / required equipment with each device's peripherals (QA Bot,\nMaxwell,\
    \ STB, Power, AVR, HDMI inputs, tuner) and Roku info (Account Type =\nregion,\
    \ Linked = connected/unconnected mode, Connection Type = wifi/ethernet,\nform\
    \ factor, 4K, tuner types, ...).\n\nRules:\n- A device is compatible only if nothing\
    \ in the case conditions rules it out.\n- \"Connected Mode / Linked\" requires\
    \ Linked=True; \"Unconnected Mode / Unlinked\"\n  requires Linked=False; \"Connected\
    \ Mode & Unconnected Mode\" accepts either.\n- Region requirements must match\
    \ the device Account Type / Model Region\n  (UK == GB). \"Global\" accepts any\
    \ region.\n- If a case needs equipment (e.g. Maxwell, an STB on HDMI, AVR, a signal\n\
    \  generator) the device must have it.\n- If no condition can be determined, every\
    \ device is compatible.\n- Do NOT balance load; only judge compatibility.\n\n\
    Return ONLY a JSON object, no prose, no code fence:\n{\"cases\": [{\"key\": \"\
    <case key>\", \"compatible\": [\"<device>\", ...],\n            \"reason\": \"\
    <= 20 words\"}]}\n\nCANDIDATE DEVICES:\n{devices}\n\nCASES:\n{cases}\n"
